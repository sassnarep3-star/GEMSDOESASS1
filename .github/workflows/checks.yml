name: Evidence and pipeline checks
on:
  pull_request:
  push:
    branches: [main, 'arena/**']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: python -m pip install -r requirements-lock.txt
      - run: pytest -q
      - run: python scripts/build_site.py
      - run: python scripts/verify_release.py
      - run: python scripts/verify_swgb_correction.py
      - run: node --check docs/assets/source-feed.js && node --test tests/test_feed.mjs
      - run: git diff --check && git diff --exit-code -- docs
