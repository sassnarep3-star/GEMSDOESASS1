name: Reproducible witness audit
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: pip
      - name: Install read-back audit dependencies
        run: python -m pip install -r requirements.txt
      - name: Fetch pinned public research witnesses
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          python -u scripts/fetch_witnesses.py > /tmp/gems-fetch.log 2>&1
          result=$?
          set -e
          cat /tmp/gems-fetch.log
          if [ "$result" -ne 0 ]; then
            while IFS= read -r line; do echo "::error::$line"; done < /tmp/gems-fetch.log
            exit "$result"
          fi
      - name: Test full read-back and site consistency
        run: |
          python -m pytest -q
          node tests/test_ui.cjs
