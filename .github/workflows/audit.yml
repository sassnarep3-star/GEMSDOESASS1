name: Reproducible witness audit
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install read-back audit dependencies
        run: python -m pip install -r requirements.txt
      - name: Fetch pinned public research witnesses
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/fetch_witnesses.py
      - name: Test full read-back and site consistency
        run: |
          python -m pytest -q
          node tests/test_ui.cjs
